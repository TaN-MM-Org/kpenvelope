[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kpenvelope"
version = "0.34.0"
description = "Polarization charge, misfit-dislocation charge, 2D electron and hole gases and device curves of GaN, AlGaN, InGaN, InAlN and ScAlN stacks, with error bars and a browser app: six-band k.p holes, Schroedinger-Poisson electrons, drift-diffusion in 1D, 2D and 3D with traps and self-heating, interface phonons, fits to measured data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tanvir M. Mahim", email = "tanvir.mahim@bracu.ac.bd" }]
requires-python = ">=3.9"
keywords = ["k.p", "envelope function", "wurtzite", "GaN", "AlGaN", "2DHG", "2DEG", "polarization", "misfit dislocation", "Schrodinger-Poisson", "uncertainty", "subband", "semiconductor", "InGaN", "InAlN", "ScAlN", "drift-diffusion", "C-V", "phonons", "GUI", "HEMT", "device simulation", "traps", "self-heating"]
dependencies = ["numpy>=1.22"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest", "scipy>=1.8"]
device = ["scipy>=1.8"]

[project.scripts]
kpenvelope-app = "kpenvelope.gui:main"

[project.urls]
Homepage = "https://tanvir-mahmud-mahim.github.io/software/"
Repository = "https://github.com/TaN-MM-Org/kpenvelope"
Issues = "https://github.com/TaN-MM-Org/kpenvelope/issues"
Changelog = "https://github.com/TaN-MM-Org/kpenvelope/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kpenvelope.gui" = ["app.html"]
