[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kpenvelope"
version = "0.17.0"
description = "Polarization charge, misfit-dislocation charge and 2D electron and hole gases in wurtzite nitride stacks, with error bars: six-band k.p holes, Schroedinger-Poisson electrons, fits to measured data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tanvir M. Mahim", email = "tanvir.mahim@bracu.ac.bd" }]
requires-python = ">=3.9"
keywords = ["k.p", "envelope function", "wurtzite", "GaN", "AlGaN", "2DHG", "2DEG", "polarization", "misfit dislocation", "Schrodinger-Poisson", "uncertainty", "subband", "semiconductor"]
dependencies = ["numpy>=1.22"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest", "scipy>=1.8"]

[project.urls]
Homepage = "https://tanvir-mahmud-mahim.github.io/software/"
Repository = "https://github.com/TaN-MM-Org/kpenvelope"
Issues = "https://github.com/TaN-MM-Org/kpenvelope/issues"
Changelog = "https://github.com/TaN-MM-Org/kpenvelope/releases"

[tool.setuptools.packages.find]
where = ["src"]
