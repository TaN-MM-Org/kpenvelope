name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[test]
      - run: pytest -q
  oldest-dependencies:
    # the lowest versions pyproject.toml allows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "numpy==1.22.0" "scipy==1.8.0" "pytest>=7"
      - run: pip install --no-deps -e .
      # SciPy 1.8.0's sparse solver has crashed the test run now and then
      # (a segmentation fault inside SuperLU) though the same tests pass
      # when run again and the crash never shows up locally with the same
      # versions; the run is repeated once if it crashes, and the fault
      # handler prints where it happened
      - name: tests (once more if the run crashes)
        shell: bash
        run: |
          python -X faulthandler -m pytest -q && exit 0
          code=$?
          if [ "$code" -lt 128 ]; then exit "$code"; fi
          echo "the test run crashed (exit code $code); running it once more"
          python -X faulthandler -m pytest -q
